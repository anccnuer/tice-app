name: Release

# 只在推送版本标签时触发：git tag v1.0.0 && git push origin v1.0.0
# 普通的 push、Pull Request、定时任务都不会运行本工作流。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# 同一个标签重复推送时不并发跑两次发布
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets 放在 Environment "release" 下，job 必须声明同名 environment 才能读取。
    # 若该 environment 配置了 required reviewers，标签推送后会等待人工批准再开始构建。
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest 已预装 Android SDK 与 cmdline-tools。
      # 不使用 android-actions/setup-android：它内部会执行 `sdkmanager tools`，
      # 而新版 cmdline-tools 已移除旧 tools 包，会直接以退出码 1 中断。
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdk_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdk_path"
          sdk_bin="$(dirname "$sdk_path")"
          test -x "$sdk_bin/sdkmanager"
          echo "sdkmanager: $sdk_bin/sdkmanager"
          echo "$sdk_bin" >> "$GITHUB_PATH"
          export ANDROID_HOME="$sdk_root"
          export ANDROID_SDK_ROOT="$sdk_root"
          export PATH="$sdk_bin:$PATH"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # gradlew 在仓库里的文件模式是 644，Linux runner 上需要显式加执行权限
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # 从仓库 Secrets 还原正式签名材料。两个文件都在 .gitignore 中，不会进入提交。
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 为空：请确认 Secrets 已添加，且 job 声明的 environment 与 Secrets 所在环境一致"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > tice-release.jks
          chmod 600 tice-release.jks
          {
            echo "storeFile=tice-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Build signed APK and run unit tests
        run: ./gradlew assembleRelease testDebugUnitTest --no-daemon --console=plain

      - name: Verify APK signature
        run: |
          set -euo pipefail
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$build_tools/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare release assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/tice-app-${TAG_NAME}.apk"
          cd release
          sha256sum *.apk > SHA256SUMS.txt

      # 使用 runner 自带的 gh CLI 与内置 GITHUB_TOKEN，不引入额外第三方 action
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          args=(--title "$TAG_NAME" --generate-notes)
          if [[ "$TAG_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG_NAME" "${args[@]}" \
            release/*.apk release/SHA256SUMS.txt

      # runner 是一次性的，仍然显式清理，避免签名材料残留在日志或缓存中
      - name: Remove signing material
        if: always()
        run: rm -f tice-release.jks keystore.properties
